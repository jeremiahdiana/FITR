<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller Sign In – FITR</title>
  <meta name="description" content="Sign in to your FITR Seller Dashboard to manage products, orders, and payouts." />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1a;
      color: #e8edf2;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden;
    }
    .bg-glow::before {
      content: '';
      position: absolute; top: -200px; left: 50%; transform: translateX(-50%);
      width: 800px; height: 600px;
      background: radial-gradient(ellipse, #00C9A70a 0%, transparent 65%);
    }

    .auth-wrap {
      width: 100%; max-width: 420px; position: relative; z-index: 1;
    }

    .auth-logo {
      text-align: center; margin-bottom: 32px;
    }
    .auth-logo-mark {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px; letter-spacing: 4px; color: #fff;
      line-height: 1;
    }
    .auth-logo-mark span { color: #00C9A7; }
    .auth-logo-sub {
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: #556; margin-top: 4px;
    }

    .auth-card {
      background: #111827;
      border: 1px solid #1e2d40;
      border-radius: 20px;
      padding: 40px 36px 36px;
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 70%; height: 1px;
      background: linear-gradient(90deg, transparent, #00C9A740, transparent);
    }

    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px; letter-spacing: 2px; color: #fff; margin-bottom: 4px;
    }
    .card-title span { color: #00C9A7; }
    .card-sub { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
    .card-sub a { color: #00C9A7; text-decoration: none; }

    .auth-msg {
      padding: 12px 16px; border-radius: 10px;
      font-size: 13px; line-height: 1.5; margin-bottom: 16px; display: none;
    }
    .auth-msg.error { background: #2d1515; border: 1px solid #7f1d1d; color: #fca5a5; display: block; }
    .auth-msg.success { background: #0f2b24; border: 1px solid #00C9A730; color: #6ee7d4; display: block; }
    .auth-msg.info { background: #1a1a00; border: 1px solid #d97706; color: #fcd34d; display: block; }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #6b7280; margin-bottom: 6px; }
    .form-input {
      width: 100%; background: #0d1117; border: 1px solid #2d3748;
      border-radius: 10px; padding: 12px 16px; font-size: 14px; color: #e8edf2;
      font-family: 'DM Sans', sans-serif; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus { border-color: #00C9A750; box-shadow: 0 0 0 3px #00C9A710; }
    .form-input::placeholder { color: #4a5568; }
    .input-wrap { position: relative; }
    .input-wrap .form-input { padding-right: 44px; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #4a5568;
      display: flex; align-items: center; transition: color 0.2s;
    }
    .pw-toggle:hover { color: #00C9A7; }

    .btn-primary {
      width: 100%; background: #00C9A7; color: #080f18;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700;
      padding: 13px 20px; border-radius: 10px; border: none; cursor: pointer;
      transition: background 0.2s, transform 0.15s; position: relative; overflow: hidden;
    }
    .btn-primary:hover { background: #00DFB9; transform: translateY(-1px); }
    .btn-primary:disabled { background: #1e2d40; color: #4a5568; cursor: not-allowed; transform: none; }
    .btn-primary.loading { color: transparent; pointer-events: none; }
    .btn-primary.loading::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 16px; height: 16px; margin: -8px 0 0 -8px;
      border: 2px solid #080f18; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #1e2d40; }
    .divider span { font-size: 11px; color: #4a5568; letter-spacing: 1px; text-transform: uppercase; }

    .btn-google {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #1a2233; color: #c9d4de; font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500; padding: 12px 20px;
      border-radius: 10px; border: 1px solid #2d3748; cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-google:hover { background: #1e2d40; transform: translateY(-1px); }

    .footer-note { text-align: center; font-size: 12px; color: #4a5568; margin-top: 20px; }
    .footer-note a { color: #6b7280; text-decoration: underline; }
    .footer-note a:hover { color: #00C9A7; }

    .new-seller-prompt {
      text-align: center; margin-top: 24px;
      padding: 16px; background: #0d1117; border: 1px solid #1e2d40; border-radius: 12px;
      font-size: 13px; color: #6b7280;
    }
    .new-seller-prompt strong { color: #c9d4de; display: block; margin-bottom: 6px; }
    .new-seller-prompt a {
      color: #00C9A7; text-decoration: none; font-weight: 600;
    }
    .new-seller-prompt a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px 28px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="auth-logo-mark">FIT<span>R</span></div>
      <div class="auth-logo-sub">Seller Portal</div>
    </div>

    <div class="auth-card">
      <h1 class="card-title">SELLER<br><span>SIGN IN.</span></h1>
      <p class="card-sub">Access your seller dashboard.</p>

      <div class="auth-msg" id="authMsg"></div>

      <button class="btn-google" id="btnGoogle">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider"><span>or</span></div>

      <form id="formSignIn" novalidate>
        <div class="form-group">
          <label class="form-label" for="siEmail">Email</label>
          <input class="form-input" type="email" id="siEmail" placeholder="you@yourbrand.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="siPassword">Password</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="siPassword" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="pw-toggle" data-target="siPassword" aria-label="Toggle password">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="btnSignIn">Sign In to Dashboard</button>
      </form>
    </div>

    <div class="new-seller-prompt">
      <strong>New to FITR Seller?</strong>
      Create your brand account at <a href="https://joinfitr.com/brand-auth" target="_blank">joinfitr.com/brand-auth →</a>
    </div>

    <div class="footer-note">
      <a href="https://joinfitr.com/terms" target="_blank">Terms</a> ·
      <a href="https://joinfitr.com/privacy" target="_blank">Privacy</a> ·
      <a href="https://joinfitr.com/brand-terms" target="_blank">Seller Agreement</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getAuth, signInWithEmailAndPassword, signInWithPopup,
      GoogleAuthProvider, onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDrBWAflUZBxLJuHqcKO2S1FkP7gs2_oME",
      authDomain: "fitr-22814.firebaseapp.com",
      projectId: "fitr-22814",
      storageBucket: "fitr-22814.firebasestorage.app",
      messagingSenderId: "900395772549",
      appId: "1:900395772549:web:2d48b5877b8d247e7797ec",
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    const gp   = new GoogleAuthProvider();

    const params     = new URLSearchParams(window.location.search);
    const subscribed = params.get('subscribed') === 'true';
    const sessionId  = params.get('session_id') || '';

    if (params.get('reason') === 'no-subscription') {
      showMsg('Your subscription is inactive. Complete payment at joinfitr.com/brand-auth', 'info');
    }

    onAuthStateChanged(auth, async function(user) {
      if (!user) return;

      if (subscribed && sessionId) {
        // Coming back from Stripe — activate subscription server-side
        showMsg('Activating your account…', 'success');
        // Clean URL so session_id isn't visible or reusable
        window.history.replaceState({}, '', '/');
        try {
          var res = await fetch('https://www.joinfitr.com/api/update-brand-subscription', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uid: user.uid, session_id: sessionId }),
          });
          var data = await res.json();
          if (data.ok) {
            window.location.href = '/dashboard';
          } else {
            showMsg('Payment received but activation failed. Email app@joinfitr.com with your order.', 'error');
          }
        } catch(e) {
          showMsg('Network error during activation. Please try signing in again.', 'error');
        }
      } else {
        await verifyAndRedirect(user);
      }
    });

    async function verifyAndRedirect(user) {
      try {
        var snap = await getDoc(doc(db, 'brands', user.uid));
        var data = snap.exists() ? snap.data() : {};
        var status = data.subscriptionStatus;
        if (status === 'active' || status === 'trialing') {
          window.location.href = '/dashboard';
        } else {
          showMsg('No active subscription found. Please complete payment at joinfitr.com/brand-auth', 'info');
        }
      } catch(e) {
        showMsg('Could not verify subscription. Contact app@joinfitr.com', 'error');
      }
    }

    function showMsg(text, type) {
      var el = document.getElementById('authMsg');
      el.textContent = text; el.className = 'auth-msg ' + type;
    }

    function friendlyError(code) {
      var m = {
        'auth/user-not-found':     'Incorrect email or password.',
        'auth/wrong-password':     'Incorrect email or password.',
        'auth/invalid-credential': 'Incorrect email or password.',
        'auth/invalid-email':      'Please enter a valid email address.',
        'auth/popup-closed-by-user':'Sign-in cancelled.',
        'auth/too-many-requests':  'Too many attempts. Please wait.',
        'auth/network-request-failed':'Network error. Check your connection.',
      };
      return m[code] || 'Something went wrong. Please try again.';
    }

    document.getElementById('btnGoogle').addEventListener('click', async function() {
      var btn = this; btn.disabled = true;
      try {
        var cred = await signInWithPopup(auth, gp);
        await verifyAndRedirect(cred.user);
      } catch(err) {
        showMsg(friendlyError(err.code), 'error');
        btn.disabled = false;
      }
    });

    document.getElementById('formSignIn').addEventListener('submit', async function(e) {
      e.preventDefault();
      var email = document.getElementById('siEmail').value.trim();
      var pw    = document.getElementById('siPassword').value;
      if (!email || !pw) { showMsg('Please fill in all fields.', 'error'); return; }
      var btn = document.getElementById('btnSignIn');
      btn.classList.add('loading');
      try {
        var cred = await signInWithEmailAndPassword(auth, email, pw);
        await verifyAndRedirect(cred.user);
      } catch(err) {
        showMsg(friendlyError(err.code), 'error');
        btn.classList.remove('loading');
      }
    });

    document.querySelector('.pw-toggle').addEventListener('click', function() {
      var inp = document.getElementById(this.dataset.target);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      this.style.color = inp.type === 'text' ? '#00C9A7' : '';
    });
  </script>
</body>
</html>
